<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact & Support — JELLWOW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand-wrap">
        <a href="/index.html" class="brand-link"><img src="/assets/logo.svg" alt="JELLWOW" class="logo"></a>
        <nav class="main-nav">
          <a href="/index.html">Home</a>
          <a href="/jobs.html">All Jobs</a>
          <a href="/companies.html">Companies</a>
        </nav>
      </div>
      <div class="header-actions">
        <button id="themeToggle" aria-label="Toggle theme" class="theme-toggle">🌙</button>
      </div>
    </div>
  </header>
  <main>
    <section class="container hero small">
      <h1>Contact & Support</h1>
      <p class="lead">Need help? Report fraud, contact support, or request business information.</p>
    </section>
    <section class="container">
      <form id="supportForm" class="support-form">
        <input placeholder="Your name" id="sname" />
        <input placeholder="Your email" id="semail" />
        <select id="stype"><option>General</option><option>Fraud Report</option><option>Business Inquiry</option></select>
        <textarea placeholder="Message" id="smsg"></textarea>
        <button type="submit" class="btn">Send</button>
      </form>
      <p id="supportResult"></p>
    </section>
  </main>
  <footer class="site-footer container"></footer>
</body>
</html>
